<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Virtual Flash — Launch</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  body { font-family:'Lexend','Poppins',sans-serif; color:#fff;
    background: radial-gradient(1200px 600px at 80% 110%, rgba(252,180,52,.22), transparent 60%),
                radial-gradient(900px 500px at 10% -10%, rgba(255,255,255,.10), transparent 60%),
                linear-gradient(160deg, var(--pvl-navy) 0%, var(--pvl-navy-dark) 100%); }
  .stage::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.08;
    background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 48px 48px; }
  .stage { position:relative; }
  .stage .pvl-title { color:#fff; font-family:'Lexend',sans-serif; font-weight:700; letter-spacing:1px; }
  .stage .pvl-title::after { background:linear-gradient(90deg, transparent, var(--pvl-gold), transparent); height:4px; border-radius:2px; }
  .kicker { font-size:.8rem; letter-spacing:4px; text-transform:uppercase; color:var(--pvl-gold); font-weight:600; margin-bottom:-24px; }
  .route { display:flex; align-items:center; gap:10px; font-size:.95rem; opacity:.9; margin-top:-16px; flex-wrap:wrap; justify-content:center; }
  .route .dot { width:8px; height:8px; border-radius:50%; background:var(--pvl-gold); }
  .route .line { width:60px; height:2px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.7) 0 6px, transparent 6px 12px); }
  .launch-footer { color:rgba(255,255,255,.7); position:relative; }
  .launch-footer a { color:var(--pvl-gold); }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; padding:40px 16px; }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:18px; min-height:180px; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-tap-highlight-color:transparent; }

  .btn {
    position:relative; display:inline-flex; align-items:center; gap:12px;
    padding:18px 44px; font-size:18px; font-weight:700; letter-spacing:.5px;
    color:#fff; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(135deg,#fcb434,#ffd27a,#f59e0b); background-size:200% 200%; color:#08306b;
    box-shadow:0 10px 30px rgba(252,180,52,.35); overflow:hidden;
    animation:gradientMove 4s ease infinite, floaty 3s ease-in-out infinite;
    transition:transform .25s ease, box-shadow .25s ease;
    -webkit-touch-callout:none; user-select:none;
  }
  .btn:hover { transform:scale(1.08) translateY(-2px); box-shadow:0 16px 40px rgba(252,180,52,.55); }
  .btn:active { transform:scale(.96); }
  .btn:focus-visible { outline:3px solid #fff; outline-offset:4px; }
  .btn .icon { font-size:22px; transition:transform .3s ease; }
  .btn:hover .icon { transform:translateX(6px) rotate(8deg); }
  .btn.clicked { animation:none; pointer-events:none; transform:scale(.97); }
  .btn::before {
    content:""; position:absolute; top:0; left:-120%; width:60%; height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg); animation:shine 3.5s ease-in-out infinite;
  }

  .loader { display:none; flex-direction:column; align-items:center; gap:12px; width:300px; max-width:80vw; }
  .loader.show { display:flex; animation:pop .4s ease; }
  .loader .label { font-size:14px; font-weight:600; color:#fff; letter-spacing:.4px; }
  .bar { width:100%; height:14px; border-radius:20px; background:rgba(255,255,255,.15); overflow:hidden; }
  .bar .fill { height:100%; width:0%; border-radius:20px; background:linear-gradient(90deg,#fcb434,#fff2cc,#fcb434);
    background-size:200% 100%; animation:gradientMove 1.5s linear infinite; transition:width .15s linear; }
  .pct { font-size:13px; font-weight:700; color:var(--pvl-gold); }

  @keyframes gradientMove { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
  @keyframes floaty { 0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)} }
  @keyframes shine { 0%{left:-120%}60%,100%{left:140%} }
  @keyframes pop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }

  @media (max-width:480px){ .btn{ font-size:16px; padding:16px 32px; } }
</style>
</head>
<body>
  <header class="pvl-topbar" style="background:transparent;border-bottom-color:rgba(252,180,52,.6);position:relative;z-index:1">
    <img src="../assets/pvl-logo-white.png" alt="Port Virtual Lab">
    <div class="tag"><b>PVL.ONE</b> · Mission control</div>
  </header>
  <main class="stage">
    <div class="kicker">Session 003</div>
    <h1 class="pvl-title">Intermodal Transport Mission</h1>
    <div class="route" aria-label="Route: Egypt to Bari, Italy"><span>Egypt</span><span class="dot"></span><span class="line"></span><span aria-hidden="true" style="display:inline-flex;gap:6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20 21c-1.39 0-2.78-.47-4-1.32-2.44 1.71-5.56 1.71-8 0C6.78 20.53 5.39 21 4 21H2v2h2c1.38 0 2.74-.35 4-.99 2.52 1.29 5.48 1.29 8 0 1.26.65 2.62.99 4 .99h2v-2h-2zM3.95 19H4c1.6 0 3.02-.88 4-2 .98 1.12 2.4 2 4 2s3.02-.88 4-2c.98 1.12 2.4 2 4 2h.05l1.89-6.68c.08-.26.06-.54-.06-.78s-.34-.42-.6-.5L20 10.62V6c0-1.1-.9-2-2-2h-3V1H9v3H6c-1.1 0-2 .9-2 2v4.62l-1.29.42c-.26.08-.48.26-.6.5s-.15.52-.06.78L3.95 19zM6 6h12v3.97L12 8 6 9.97V6z"/></svg><svg width="20" height="20" viewBox="0 0 24 24" fill="#fcb434"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span><span class="line"></span><span class="dot"></span><span>Bari · Italy</span></div>
    <div class="wrap">
      <button class="btn" id="goBtn" onclick="launch()">
        <span>LAUNCH</span>
        <span class="icon" aria-hidden="true">🚀</span>
      </button>

      <div class="loader" id="loader" role="status" aria-live="polite">
        <div class="label" id="label">Preparing your experience…</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>
  </main>

  <footer class="pvl-footer launch-footer">
    <a href="https://www.pvl.one" target="_blank" rel="noopener noreferrer">Port Virtual Lab</a> developed by
    <a href="https://www.escolaeuropea.eu" target="_blank" rel="noopener noreferrer">Escola Europea - Intermodal Transport</a>.
  </footer>

<script>
  var TARGET = '../mission/';

  function launch(){
    var btn = document.getElementById('goBtn');
    var fill = document.getElementById('fill');
    var pct = document.getElementById('pct');
    btn.classList.add('clicked');
    document.getElementById('loader').classList.add('show');

    var p = 0;
    var timer = setInterval(function(){
      p += Math.random() * 12 + 4; // uneven, natural-feeling progress
      if (p >= 100) { p = 100; clearInterval(timer); done(); }
      fill.style.width = p + '%';
      pct.textContent = Math.floor(p) + '%';
    }, 180);

    function done(){
      document.getElementById('label').textContent = 'Ready! Opening…';
      setTimeout(function(){ location.href = TARGET; }, 500);
    }
  }
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    document.getElementById('goBtn').classList.remove('clicked');
    document.getElementById('loader').classList.remove('show');
    document.getElementById('fill').style.width = '0%';
    document.getElementById('pct').textContent = '0%';
    document.getElementById('label').textContent = 'Preparing your experience…';
  });
</script>
</body>
</html>
