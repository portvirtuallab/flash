<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Port Virtual Flash — Welcome Participants</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:48px; padding:40px 16px; }

    .ms-card { width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; gap:28px; padding:20px; }
    .ms-icon { width:72px; height:72px; border-radius:50%; background:#b20000; display:flex; align-items:center; justify-content:center; }
    .ms-title { text-align:center; }
    .ms-title h2 { font-size:22px; font-weight:600; color:#111; margin:0 0 6px; }
    .ms-title p { font-size:14px; color:#666; margin:0; }

    .ms-btn {
      width:100%; padding:16px 32px; background:#b20000; color:#fff;
      font-size:18px; font-weight:600; font-family:'Poppins',sans-serif; letter-spacing:2px; text-transform:uppercase;
      border:none; border-radius:10px; cursor:pointer; -webkit-appearance:none;
      transition:background .2s, transform .15s;
    }
    .ms-btn:hover  { background:#d40000; transform:scale(1.03); }
    .ms-btn:active { background:#8a0000; transform:scale(.98); }
    .ms-btn:disabled { background:#aaa; cursor:not-allowed; transform:none; }
    .ms-btn:focus-visible { outline:3px solid #4A90E2; outline-offset:3px; }

    .ms-loading { display:none; flex-direction:column; gap:12px; width:100%; }
    .ms-bar-wrap { width:100%; height:10px; background:#e5e5e5; border-radius:99px; overflow:hidden; }
    .ms-bar { height:100%; width:0%; background:#b20000; border-radius:99px; transition:width .9s cubic-bezier(.4,0,.2,1); }
    .ms-msg { font-size:14px; color:#666; letter-spacing:.5px; text-align:center; min-height:20px; }
  </style>
</head>
<body>
  <main class="welcome">
    <h1 class="pvl-title">Welcome Participants</h1>

    <div class="ms-card">
      <div class="ms-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </div>

      <div class="ms-title">
        <h2>Port Virtual Lab</h2>
        <p>Session 003 — Interactive scenario</p>
      </div>

      <button class="ms-btn" id="ms-btn" onclick="startMission()">Ready to go</button>

      <div class="ms-loading" id="ms-loading" role="status" aria-live="polite">
        <div class="ms-bar-wrap"><div class="ms-bar" id="ms-bar"></div></div>
        <div class="ms-msg" id="ms-msg">Initializing...</div>
      </div>
    </div>
  </main>

  <footer class="pvl-footer">
    <a rel="license" href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank"><img alt="Creative Commons License" src="https://i.creativecommons.org/l/by-nc-nd/4.0/88x31.png" width="88" height="31"></a>
    <p>This work is licensed under a <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank" rel="license noopener noreferrer">Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International License</a>.<br>
    <a href="https://www.pvl.one" target="_blank" rel="noopener noreferrer">Port Virtual Lab</a> developed by <a href="https://www.escolaeuropea.eu" target="_blank" rel="noopener noreferrer">Escola Europea - Intermodal Transport</a>.</p>
  </footer>

  <script>
    function startMission() {
      var btn = document.getElementById('ms-btn');
      var bar = document.getElementById('ms-bar');
      var msg = document.getElementById('ms-msg');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      document.getElementById('ms-loading').style.display = 'flex';

      var steps = [
        { pct: 33,  text: 'Loading scenario...'    },
        { pct: 66,  text: 'Preparing resources...' },
        { pct: 100, text: 'All systems go!'        }
      ];
      var i = 0;
      (function next() {
        bar.style.width = steps[i].pct + '%';
        msg.textContent = steps[i].text;
        i++;
        if (i < steps.length) setTimeout(next, 900);
        else setTimeout(function () { location.href = 'launch/'; }, 600);
      })();
    }
    // If the page is restored from the back/forward cache, reset the button.
    window.addEventListener('pageshow', function (e) {
      if (!e.persisted) return;
      var btn = document.getElementById('ms-btn');
      btn.disabled = false; btn.textContent = 'Ready to go';
      document.getElementById('ms-loading').style.display = 'none';
      document.getElementById('ms-bar').style.width = '0%';
    });
  </script>
</body>
</html>
